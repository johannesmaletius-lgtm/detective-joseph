# Veröffentlicht das Spiel bei jedem Push auf main auf GitHub Pages (Web-Fassung, Türen öffnen nach Datum – zum Testen ?test anhängen).
# Einmalig nötig: GitHub → Settings → Pages → „Build and deployment“ → Source: „GitHub Actions“.
name: Spiel online stellen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg installieren (für die Stimmen)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Web-Fassung bauen
        run: node tools/build-web.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
